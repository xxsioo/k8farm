name: build-ios

# 解包 payloadF.b64（单行 python3 -c，避免 heredoc 在 YAML 块里被缩进）
# → 编译 payload dylib（路径 A 用）
# → 顺带编越狱 tweak（可选，失败不影响）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 解包源码
        run: |
          python3 -c "import base64,pathlib; pathlib.Path('/tmp/src.zip').write_bytes(base64.b64decode(pathlib.Path('payloadF.b64').read_bytes()))"
          ls -l /tmp/src.zip
          unzip -q /tmp/src.zip -d .
          chmod +x .ci/*.sh 2>/dev/null || true
          echo "--- 解包结果 ---"
          ls -la
          test -f ios/tweak/Collector.m && echo "OK Collector.m"
          test -f ios/payload/k8hooks.m && echo "OK k8hooks.m"
          test -f .ci/build-payload.sh && echo "OK build-payload.sh"

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译 payload dylib
        run: bash .ci/build-payload.sh

      - name: 编译越狱 tweak（可选）
        continue-on-error: true
        run: |
          brew install ldid xz || true
          export THEOS="$HOME/theos"
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          cd ios/tweak
          make clean || true
          make package DEBUG=0 FINALPACKAGE=1 ROOTLESS=1 || true
          mkdir -p ../../dist
          cp packages/*.deb ../../dist/ 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8farm-payload
          path: |
            dist/bootstrap.dylib
            dist/payload-build.log
            dist/*.deb
          if-no-files-found: warn
          retention-days: 90
