name: build-ios

# 解包 payloadF.b64 → 编译 payload dylib（路径 A 用）+ 越狱 tweak
# 产物：dist/bootstrap.dylib / dist/*.deb / dist/payload-build.log

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 解包源码
        run: |
          python3 - <<'PY'
          import base64
          raw = base64.b64decode(open('payloadF.b64','rb').read())
          open('/tmp/src.zip','wb').write(raw)
          print('zip bytes:', len(raw))
          PY
          unzip -q /tmp/src.zip -d .
          chmod +x .ci/*.sh 2>/dev/null || true
          echo "--- 解包结果 ---"
          ls -la
          test -d ios/tweak && echo "OK ios/tweak"
          test -d ios/payload && echo "OK ios/payload"
          test -f ios/payload/k8hooks.m && echo "OK k8hooks.m"
          test -f .ci/build-payload.sh && echo "OK build-payload.sh"

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译 payload dylib（路径 A 专用）
        run: bash .ci/build-payload.sh

      - name: 编译越狱 tweak（rootless，可选）
        continue-on-error: true
        run: |
          brew install ldid xz || true
          export THEOS="$HOME/theos"
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          cd ios/tweak
          make clean || true
          make package DEBUG=0 FINALPACKAGE=1 ROOTLESS=1 || true
          mkdir -p ../../dist
          cp packages/*.deb ../../dist/ 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8farm-payload
          path: |
            dist/bootstrap.dylib
            dist/payload-build.log
            dist/*.deb
          if-no-files-found: warn
          retention-days: 90
