name: build-ios

# 用 base64 -d 解包（macOS 自带），避开 python3 -c 在 YAML 块里的引号问题

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 诊断环境
        run: |
          pwd
          ls -la payloadF.b64
          wc -c payloadF.b64
          which python3 base64 unzip
          python3 --version

      - name: 解包源码
        run: |
          base64 -d payloadF.b64 > /tmp/src.zip || base64 -D payloadF.b64 > /tmp/src.zip
          ls -l /tmp/src.zip
          unzip -q /tmp/src.zip -d .
          chmod +x .ci/*.sh 2>/dev/null || true
          echo "--- unpacked ---"
          ls -la
          test -f ios/tweak/Collector.m && echo OK-Collector.m
          test -f ios/payload/k8hooks.m && echo OK-k8hooks.m
          test -f .ci/build-payload.sh && echo OK-build-payload.sh

      - name: 编译 payload dylib
        run: bash .ci/build-payload.sh

      - name: 编译越狱 tweak（可选）
        continue-on-error: true
        run: |
          brew install ldid xz || true
          export THEOS="$HOME/theos"
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          cd ios/tweak
          make clean || true
          make package DEBUG=0 FINALPACKAGE=1 ROOTLESS=1 || true
          mkdir -p ../../dist
          cp packages/*.deb ../../dist/ 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8farm-payload
          path: |
            dist/bootstrap.dylib
            dist/payload-build.log
            dist/*.deb
          if-no-files-found: warn
          retention-days: 90
